# Builds and tests every push: the Java modules (with the desktop tests on headless JavaFX), then
# the web client and its functional tests against the REST API started from the same commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  java:
    name: Java modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type checks, lint, format and unit tests
        run: npm run check
      - run: npm run build
      - name: Start the REST API and the development server
        working-directory: .
        run: |
          ./mvnw -B -q -pl server -am install -DskipTests -Dcheckstyle.skip -Djacoco.skip
          ./mvnw -B -q -pl server dependency:build-classpath -Dmdep.outputFile=classpath.txt
          nohup java -cp "server/target/classes:$(cat server/classpath.txt)" \
            com.bioinfo.cytoscope.server.ApiServer > api.log 2>&1 &
          (cd web && nohup npm run dev > ../vite.log 2>&1 &)
          for i in $(seq 30); do
            curl -fsS http://localhost:5175/api/health && exit 0
            sleep 2
          done
          cat api.log vite.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - name: Functional tests
        run: npm run test:e2e:local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
